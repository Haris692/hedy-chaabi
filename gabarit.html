<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hedy Chaabi — Attacking midfielder</title>
<meta name="description" content="Hedy Chaabi, Algerian attacking midfielder, free agent. Career record, 2025/26 Kuwaiti season and a full match tagged action by action.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --surface-0:#f3efe8; --surface-1:#fffdfa; --surface-2:#e8e2d8;
  --ink:#16140f; --ink-2:#4d4a43; --ink-3:#7a766c;
  --line:#ddd6c9; --line-2:#c6bdac;
  --accent:#1d5fc4; --accent-soft:#1d5fc41a;
  --sh-1:0 1px 2px rgba(22,20,15,.05), 0 2px 8px rgba(22,20,15,.04);
  --sh-2:0 2px 4px rgba(22,20,15,.06), 0 12px 30px rgba(22,20,15,.10);
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
  --bar-muted:#cbc9c3; --pitch-line:#c3c1ba; --pitch-bg:#f7f6f3;
  --hero-bg:#101418; --hero-ink:#f7f4ee; --hero-ink-2:#9ea49e; --hero-line:#272d33;
  --good:#1f7a4d; --draw:#8a7a1f; --bad:#a33a35;
  --r:12px;
  /* Oswald ne porte AUCUN glyphe arabe : en arabe le texte retombe tout seul
     sur IBM Plex Sans Arabic, sans avoir a tester la langue en CSS. */
  --sans:"Inter","IBM Plex Sans Arabic","Segoe UI",system-ui,-apple-system,
         "Noto Naskh Arabic",Tahoma,Arial,sans-serif;
  --display:"Oswald","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface-0:#111310; --surface-1:#1a1d19; --surface-2:#242720;
    --ink:#f5f2ea; --ink-2:#c2bfb2; --ink-3:#928e82;
    --line:#2f332c; --line-2:#43473e;
    --accent:#5d97f0; --accent-soft:#5d97f01f;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 2px 6px rgba(0,0,0,.45), 0 16px 34px rgba(0,0,0,.5);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --bar-muted:#403f3b; --pitch-line:#46453f; --pitch-bg:#201f1d;
    --hero-bg:#0d0f13; --hero-ink:#f6f5f2; --hero-ink-2:#9ea1a8; --hero-line:#242830;
    --good:#4caf7d; --draw:#c2a93a; --bad:#e06b66;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--surface-0);color:var(--ink);font-family:var(--sans);
  font-size:16.5px;line-height:1.62;-webkit-text-size-adjust:100%;
  font-feature-settings:"cv05","ss01";text-rendering:optimizeLegibility}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
h1,h2,h3{line-height:1.12;margin:0}
h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,4.2vw,42px);
  letter-spacing:.004em;text-transform:uppercase}
/* Un filet sous le titre. POSITIONNE EN ABSOLU, pas en bloc dans le flux :
   en RTL un bloc de largeur fixe ne se calait ni a gauche ni a droite du titre
   arabe mais au milieu. `inset-inline-start` ne laisse aucune ambiguite -- a
   gauche en francais, a droite en arabe. */
section>.wrap>h2{position:relative;padding-bottom:17px}
section>.wrap>h2::after{content:"";position:absolute;inset-block-end:0;
  inset-inline-start:0;width:52px;height:3px;border-radius:2px;background:var(--accent)}
p{margin:0 0 14px}
a{color:var(--accent)}
section{padding:72px 0;border-top:1px solid var(--line)}
section>.wrap>h2{margin-bottom:8px}
.lede{color:var(--ink-2);max-width:64ch;margin:18px 0 30px;font-size:17px}

/* ---------------- barre du haut ---------------- */
header.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface-0) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;height:62px}
.bar .nm{font-family:var(--display);font-weight:600;text-transform:uppercase;
  font-size:19px;letter-spacing:.02em;white-space:nowrap}
.bar nav{display:flex;gap:16px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none}
.bar nav::-webkit-scrollbar{display:none}
.bar nav a{color:var(--ink-2);text-decoration:none;font-size:14.5px;font-weight:500;
  white-space:nowrap;padding:6px 0;border-bottom:2px solid transparent}
.bar nav a:hover{border-bottom-color:var(--accent)}
.bar nav a:hover{color:var(--ink)}
.langs{display:flex;gap:2px;background:var(--surface-2);border-radius:99px;padding:3px;
  margin-inline-start:auto}
.bar nav+.langs{margin-inline-start:0}
.langs button{border:0;background:none;color:var(--ink-3);font:inherit;font-size:13px;
  font-weight:600;padding:3px 10px;border-radius:99px;cursor:pointer}
.langs button.on{background:var(--surface-1);color:var(--ink);box-shadow:0 1px 2px #0002}

/* ---------------- hero ---------------- */
/* Une lueur derriere la photo : elle donne de la profondeur au bandeau sans
   image de fond a charger, et elle se place du bon cote en arabe grace a
   `inset-inline-start`. */
.hero{background:var(--hero-bg);color:var(--hero-ink);padding:60px 0 68px;
  position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset-inline-start:-6%;top:-40%;
  width:60%;height:180%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(29,95,196,.30),transparent 70%)}
.hgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
  gap:44px;align-items:center;position:relative}
.hid{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.photo{width:168px;height:168px;border-radius:20px;object-fit:cover;
  object-position:center 18%;flex:0 0 auto;
  background:var(--hero-line);box-shadow:0 0 0 1px var(--hero-line),0 18px 40px rgba(0,0,0,.45)}
.who{flex:1 1 260px;min-width:240px}
.who h1{font-family:var(--display);font-weight:600;text-transform:uppercase;
  font-size:clamp(34px,5.6vw,58px);letter-spacing:.01em;line-height:1.02}
/* inline-block : la boite se cale au DEBUT de la ligne (a gauche en francais,
   a droite en arabe) pendant que le texte reste ecrit de droite a gauche.
   Sans ca le nom arabe partait tout seul a l'autre bout du bandeau. */
.who .ar-name{display:inline-block;direction:rtl;font-size:21px;
  color:var(--hero-ink-2);margin-top:6px}
.who .role{color:var(--hero-ink-2);margin-top:10px;font-size:17px}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:8px 16px;
  border-radius:99px;background:#1f7a4d26;color:#6fdda6;border:1px solid #1f7a4d80;
  font-weight:600;font-size:14.5px;letter-spacing:.01em}
.badge i{animation:puls 2.4s ease-in-out infinite}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.badge i{animation:none}}
.badge i{width:7px;height:7px;border-radius:50%;background:#5fd39a;display:block}
.badge-note{display:block;font-size:13px;color:var(--hero-ink-2);margin-top:8px}
/* Les separateurs sont dessines par les cellules (box-shadow) et non par le
   fond de la grille : quand la derniere rangee n'est pas pleine, la case vide
   reste du fond du bandeau au lieu d'apparaitre comme un bloc gris. */
/* DEUX colonnes, pas auto-fit : cinq informations se rangent alors en
   2 + 2 + 1 pleine largeur, sans case vide. En auto-fit le navigateur en met
   trois et il reste un trou, qui se dessine quand meme et ressemble a un bug. */
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;
  background:var(--hero-bg);border:1px solid var(--hero-line);border-radius:16px;
  overflow:hidden;margin-top:0}
.facts div{background:rgba(255,255,255,.028);padding:14px 16px;
  box-shadow:0 0 0 1px var(--hero-line)}
/* Cinq informations dans une grille a trois colonnes laissent un TROU : la
   case vide se dessine quand meme et ressemble a un bug. La derniere prend
   toute la largeur restante -- et le nom du club cesse de se couper en deux. */
.facts div:last-child{grid-column:1/-1}
.hside .badge-note{opacity:.8}
.facts dt{font-size:12px;color:var(--hero-ink-2);text-transform:uppercase;letter-spacing:.06em}
.facts dd{margin:4px 0 0;font-weight:600;font-size:17px}

/* ---------------- tuiles ---------------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px;
  margin-top:-38px;position:relative;z-index:2}
/* Les tuiles chevauchent la frontiere sombre/claire : sans ombre portee le
   chevauchement a l'air d'un accident de mise en page plutot que d'un choix. */
.tile{background:var(--surface-1);border:1px solid var(--line);border-radius:16px;
  padding:20px 20px 18px;box-shadow:var(--sh-2);transition:transform .16s ease}
.tile:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
.tile b{display:block;font-family:var(--display);font-weight:600;font-size:52px;
  line-height:1;letter-spacing:.005em;font-variant-numeric:tabular-nums}
.tile b sup{font-size:.45em;vertical-align:super;font-weight:600;margin-inline-start:1px}
.tile .lb{font-weight:600;margin-top:8px;font-size:15.5px}
.tile .sb{font-size:13.5px;color:var(--ink-3);line-height:1.45;margin-top:4px}
.tile:first-child b{color:var(--accent)}

/* ---------------- tableaux ---------------- */
table{width:100%;border-collapse:collapse;font-size:15.5px}
tbody tr{transition:background .12s ease}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
th{text-align:start;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink-3);font-weight:600;padding:0 10px 10px;border-bottom:1px solid var(--line-2)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.scored td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.rnd{font-variant-numeric:tabular-nums;color:var(--ink-3);width:1%}
.dt{white-space:nowrap;color:var(--ink-2);font-variant-numeric:tabular-nums;width:1%}
.opp{font-weight:600}
.ha{font-weight:400;color:var(--ink-3);font-size:13px}
.res{display:inline-block;min-width:54px;text-align:center;padding:2px 8px;border-radius:6px;
  font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.res.W{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.res.D{background:color-mix(in srgb,var(--draw) 16%,transparent);color:var(--draw)}
.res.L{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.gl{width:1%;white-space:nowrap}
.g{display:inline-block;background:var(--series-1);color:#fff;border-radius:5px;
  padding:1px 7px;font-size:13px;font-weight:700;margin-inline-end:4px}
.num{text-align:end;font-variant-numeric:tabular-nums;width:1%;white-space:nowrap}
.sea,.cl{white-space:nowrap}
.cl{font-weight:600;display:flex;align-items:center;gap:9px}
.crest{width:24px;height:24px;object-fit:contain;flex:0 0 auto}
td.num.goals{font-weight:700;color:var(--ink)}
td.num.empty{color:var(--ink-3)}
.scroll{overflow-x:auto}

/* Ilots ecrits de gauche a droite, y compris quand la page passe en arabe.
   Sans ca l'algorithme bidi retourne « 3-1 » en « 1-3 » (le tiret est un
   caractere neutre entre deux nombres) : le score affiche devient FAUX, et
   seul un lecteur arabophone le remarque. Meme chose pour les graphiques,
   dont les etiquettes latines se collaient au mauvais bord. */
/* NB : pas `.vid span` ici. Il contient une date ecrite par le navigateur
   dans la langue lue ; la forcer en LTR sortait « فبراير 20 2026 » au lieu
   de « 20 فبراير 2026 ». On n'isole que ce qui melange chiffres et signes
   neutres. */
.res,.g,.sea,.bars,.pitch{direction:ltr;unicode-bidi:isolate}
.bars text{direction:ltr}

/* ---------------- figures ---------------- */
figure{margin:26px 0 0}
figcaption,.src{font-size:13px;color:var(--ink-3);margin-top:10px;max-width:62ch}
.bars{width:100%;height:auto;max-width:520px;display:block}
.bars text{font-family:var(--sans);font-size:13px;fill:var(--ink-2)}
.bars .bar-name{text-anchor:end}
.bars .bar-val{font-weight:700;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.bars .me{fill:var(--ink);font-weight:700}
.pitches{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;
  margin-top:24px}
.pitchbox{background:var(--pitch-bg);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--sh-1);
  padding:12px 12px 8px}
.pitchbox h3{font-size:14px;display:flex;align-items:center;gap:8px}
.pitchbox h3 i{width:10px;height:10px;border-radius:50%;display:block}
.pitchbox .cnt{margin-inline-start:auto;font-size:13px;color:var(--ink-3);font-weight:600;
  font-variant-numeric:tabular-nums}
.pitch{width:100%;height:auto;display:block;margin-top:8px}
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;
  margin:22px 0 0}
.mstat{border-inline-start:3px solid var(--series-1);padding:2px 0 2px 14px}
html[dir="rtl"] .mstat{padding:2px 14px 2px 0}
.mstat b{font-size:26px;font-variant-numeric:tabular-nums;display:block;line-height:1.15}
.mstat span{font-size:13px;color:var(--ink-3)}
.mstat:nth-child(2){border-color:var(--series-2)}
.mstat:nth-child(3){border-color:var(--series-3)}
.mstat:nth-child(4){border-color:var(--line-2)}
.note{background:var(--surface-1);border:1px solid var(--line);border-inline-start:3px solid var(--series-1);
  border-radius:var(--r);padding:14px 16px;margin-top:22px;font-size:15px;color:var(--ink-2)}
.note b{color:var(--ink)}
.note.warn{border-inline-start-color:var(--series-2)}

/* ---------------- video ---------------- */
h3.sub{font-size:15px;margin:22px 0 8px;letter-spacing:.01em}
h3.sub+.lede{margin-bottom:16px}
.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.vid{display:flex;gap:12px;align-items:center;background:var(--surface-1);
  border:1px solid var(--line);border-radius:var(--r);padding:10px;text-decoration:none;
  color:inherit}
.vid:hover{border-color:var(--line-2)}
.vid img{width:96px;height:54px;object-fit:cover;border-radius:7px;flex:0 0 auto;
  background:var(--surface-2)}
.vid b{display:block;font-size:14px}
.vid span{display:block;font-size:13px;color:var(--ink-3)}
.vid .tag{color:var(--series-1);font-weight:600;font-size:12px}

/* ---------------- contact ---------------- */
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r);
  padding:22px}
.card a.mail{font-size:19px;font-weight:700;word-break:break-all}
footer{padding:26px 0 46px;color:var(--ink-3);font-size:13px;border-top:1px solid var(--line)}
footer .wrap{max-width:980px}

/* Le heros passe en UNE colonne bien avant le telephone : a 900 px les deux
   colonnes se serrent deja et « NATIONALITE » se coupe. Verifie a 500 et
   760 px, sans debordement horizontal. */
@media (max-width:900px){
  .hgrid{grid-template-columns:1fr;gap:30px}
  .hero{padding:44px 0 52px}
}
@media (max-width:640px){
  .hero{padding:34px 0 40px}
  .photo{width:118px;height:118px;border-radius:16px}
  .hid{gap:18px}
  .who h1{font-size:clamp(30px,9vw,40px)}
  .tiles{margin-top:18px}
  .tile b{font-size:44px}
  .bar nav{display:none}
  section{padding:52px 0}
}
.zonebox{max-width:660px;margin:30px auto;background:var(--surface-1);
  border:1px solid var(--line);border-radius:16px;padding:18px 20px 12px;box-shadow:var(--sh-1)}
.zonebox h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px}
.zonebox h3 .cnt{margin-left:auto;color:var(--muted);font-weight:500}
.zonebox .src{margin:8px 0 2px}
text.zn{font:600 4.6px var(--sans);fill:var(--ink);
  text-anchor:middle;paint-order:stroke;stroke:var(--surface-1);stroke-width:1.1px}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <span class="nm">Hedy Chaabi</span>
    <nav>
      <a href="#season" data-t="nav_season"></a>
      <a href="#match" data-t="nav_match"></a>
      <a href="#career" data-t="nav_career"></a>
      <a href="#video" data-t="nav_video"></a>
      <a href="#contact" data-t="nav_contact"></a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="en">EN</button>
      <button data-lang="fr">FR</button>
      <button data-lang="ar">ع</button>
    </div>
  </div>
</header>

<div class="hero">
  <div class="wrap hgrid">
    <div class="hid">
      <img class="photo" src="hedy-chaabi.webp" alt="Hedy Chaabi">
      <div class="who">
        <h1>Hedy Chaabi</h1>
        <div class="ar-name" lang="ar" dir="rtl">هيدي شعيبي</div>
        <div class="role" data-t="role"></div>
        <span class="badge"><i></i><span data-t="status"></span></span>
        <span class="badge-note" data-t="status_note"></span>
      </div>
    </div>
    <div class="hside">
    <dl class="facts">
      <div><dt data-t="f_age"></dt><dd><span id="v-age"></span> <span data-t="years"></span></dd></div>
      <div><dt data-t="f_height"></dt><dd dir="ltr"><span id="v-height"></span> cm</dd></div>
      <div><dt data-t="f_foot"></dt><dd data-t="f_left"></dd></div>
      <div><dt data-t="f_nat"></dt><dd data-t="f_nat_v"></dd></div>
      <div><dt data-t="f_last"></dt><dd>Al Jazeera FC<span style="display:block;font-weight:400;font-size:13px;color:var(--hero-ink-2)">Kuwait · 2026</span></dd></div>
    </dl>
    <p class="badge-note" style="margin-top:12px" data-t="f_born"></p>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="tiles">
    <div class="tile"><b id="v-goals"></b>
      <div class="lb" data-t="t_goals"></div><div class="sb" data-t="t_goals_s"></div></div>
    <div class="tile"><b id="v-rank-club"></b>
      <div class="lb" data-t="t_club"></div><div class="sb" data-t="t_club_s"></div></div>
    <div class="tile"><b id="v-rank-div"></b>
      <div class="lb" data-t="t_div"></div><div class="sb" data-t="t_div_s"></div></div>
    <div class="tile"><b id="v-rank-team"></b>
      <div class="lb" data-t="t_team"></div><div class="sb" data-t="t_team_s"></div></div>
  </div>
</div>

<section id="season">
  <div class="wrap">
    <h2 data-t="s_season"></h2>
    <p class="lede" data-t="season_intro"></p>
    <div class="scroll">
      <table>
        <thead><tr>
          <th data-t="th_round"></th><th data-t="th_date"></th>
          <th data-t="th_opp"></th><th data-t="th_score"></th><th data-t="th_his"></th>
        </tr></thead>
        <tbody>{{MATCHS}}</tbody>
      </table>
    </div>
    <p class="src" data-t="gap_note"></p>
    <figure>
      <h3 style="font-size:15px;margin-bottom:12px" data-t="scorers_t"></h3>
      {{BARRES}}
      <figcaption data-t="scorers_c"></figcaption>
    </figure>
  </div>
</section>

<section id="match">
  <div class="wrap">
    <h2 data-t="s_match"></h2>
    <p class="lede" data-t="match_intro"></p>
    <div class="mstats">
      <div class="mstat"><b>1</b><span data-t="m_goal"></span></div>
      <div class="mstat"><b>2</b><span data-t="m_assists"></span></div>
      <div class="mstat"><b id="v-drib"></b><span data-t="m_drib"></span></div>
      <div class="mstat"><b id="v-actions"></b><span data-t="m_actions"></span></div>
      <div class="mstat"><b>{{N_PROG}}</b><span data-t="m_prog"></span></div>
    </div>
    <div class="zonebox">
      <h3><span data-t="p_zones"></span>
        <span class="cnt" id="v-zleg"></span></h3>
      {{PITCH_P_ZONES}}
      <p class="src" data-t="zones_cap"></p>
      <p class="src" data-t="zones_vid"></p>
    </div>
    <div class="pitches">
      <div class="pitchbox">
        <h3><i style="background:var(--series-1)"></i><span data-t="p_passes"></span>
          <span class="cnt">23</span></h3>{{PITCH_P_PASSES}}</div>
      <div class="pitchbox">
        <h3><i style="background:var(--series-3)"></i><span data-t="p_drib"></span>
          <span class="cnt">7</span></h3>{{PITCH_P_DRIB}}</div>
      <div class="pitchbox">

<script>
const T = {{T}}, D = {{D}};
const LANGS = ["en","fr","ar"];
const VALS = Object.assign({}, D.zones, {
  nb: D.nButeurs, tie: D.exaequo, d: D.dateMatch, gen: D.gen
});

/* Les dates sont ecrites par le navigateur dans la langue lue : "5 Feb 2026",
   "5 fevr. 2026", "5 fevrier 2026" en arabe. On force les chiffres latins en
   arabe (-u-nu-latn) : le reste de la page compte en chiffres latins, et une
   page qui melange 5 et un cinq arabe se lit comme deux pages. */
const LOCALE = {en:"en-GB", fr:"fr-FR", ar:"ar-KW-u-nu-latn"};
function dates(lang){
  document.querySelectorAll("[data-date]").forEach(el => {
    const d = new Date(el.dataset.date + "T12:00:00");
    el.textContent = d.toLocaleDateString(LOCALE[lang],
      {day:"numeric", month:"short", year:"numeric"});
  });
}

function fmt(s){ return s.replace(/%\((\w+)\)[ds]/g, (_, k) => VALS[k]); }

function apply(lang){
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === "ar") ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => {
    const s = T[el.dataset.t];
    if (s) el.innerHTML = fmt(s[lang]);
  });
  document.querySelectorAll("[data-tj]").forEach(el => {
    el.textContent = JSON.parse(el.dataset.tj)[lang];
  });
  dates(lang);
  /* 2417 -> « 2,417 » en anglais, « 2 417 » en francais : un nombre de minutes
     a quatre chiffres se lit mal collee. */
  document.querySelectorAll("[data-num]").forEach(el => {
    el.textContent = Number(el.dataset.num).toLocaleString(LOCALE[lang]);
  });
  const sup = o => (o[lang] ? "<sup>" + o[lang] + "</sup>" : "");
  document.getElementById("v-age").textContent = D.age;
  document.getElementById("v-height").textContent = D.height;
  document.getElementById("v-goals").textContent = D.goals;
  document.getElementById("v-drib").textContent = D.nDrib + "/" + D.nDrib;
  document.getElementById("v-actions").textContent = D.zones.n;
  document.getElementById("v-zleg").textContent =
      (T.zones_leg[lang] || "").replace("%d", D.zones.n).replace("%d", D.nVid);
  document.getElementById("v-rank-club").innerHTML = D.rangClub + sup(D.ordClub);
  document.getElementById("v-rank-div").innerHTML  = D.rangDiv  + sup(D.ordDiv);
  document.getElementById("v-rank-team").innerHTML = D.rangEquipe + sup(D.ordTeam);
  document.querySelectorAll(".langs button").forEach(b =>
    b.classList.toggle("on", b.dataset.lang === lang));
  try { localStorage.setItem("hc-lang", lang); } catch (e) {}
  /* La langue vit dans l'URL : un lien ?lang=ar s'ouvre en arabe chez le
     destinataire, quel que soit son navigateur. */
  const u = new URL(location.href);
  u.searchParams.set("lang", lang);
  history.replaceState(null, "", u);
}

document.querySelectorAll(".langs button").forEach(b =>
  b.addEventListener("click", () => apply(b.dataset.lang)));

let start = new URLSearchParams(location.search).get("lang") || "";
if (!LANGS.includes(start)) {
  try { start = localStorage.getItem("hc-lang") || ""; } catch (e) {}
}
if (!LANGS.includes(start)) {
  const nav = (navigator.language || "en").slice(0, 2);
  start = LANGS.includes(nav) ? nav : "en";
}
apply(start);
</script>
